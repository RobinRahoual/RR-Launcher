<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a36"/><stop offset="1" stop-color="#121219"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1440"/><stop offset=".55" stop-color="#5b1230"/><stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx=".7" cy=".75" r=".8">
      <stop offset="0" stop-color="#ff8aa0" stop-opacity=".55"/><stop offset="1" stop-color="#ff8aa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caseBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0d13"/><stop offset=".08" stop-color="#22222c"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1426"/><stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".03"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fanGlow" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#f43f5e" stop-opacity="0"/><stop offset=".8" stop-color="#f43f5e" stop-opacity=".95"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fanGlow2" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#a855f7" stop-opacity="0"/><stop offset=".8" stop-color="#a855f7" stop-opacity=".95"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="interior" cx=".5" cy=".55" r=".7">
      <stop offset="0" stop-color="#f43f5e" stop-opacity=".35"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#f43f5e"/><stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="kb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262f"/><stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <g id="fan">
      <circle r="34" fill="#0c0b12" stroke="#2c2a36" stroke-width="2"/>
      <circle r="31" fill="url(#fanGlow)"/>
      <g fill="#1d1b26" stroke="#3a3646" stroke-width="1">
        <path d="M0-6C8-24 22-22 24-14 18-10 8-6 0-6Z"/>
        <path d="M0-6C8-24 22-22 24-14 18-10 8-6 0-6Z" transform="rotate(72)"/>
        <path d="M0-6C8-24 22-22 24-14 18-10 8-6 0-6Z" transform="rotate(144)"/>
        <path d="M0-6C8-24 22-22 24-14 18-10 8-6 0-6Z" transform="rotate(216)"/>
        <path d="M0-6C8-24 22-22 24-14 18-10 8-6 0-6Z" transform="rotate(288)"/>
      </g>
      <circle r="8" fill="#14121b" stroke="#f43f5e" stroke-opacity=".7" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Écran -->
  <g>
    <rect x="160" y="400" width="150" height="10" rx="5" fill="#000" opacity=".45"/>
    <path d="M222 318h26l10 72h-46z" fill="#1a1a22"/>
    <rect x="182" y="388" width="106" height="12" rx="6" fill="#22222b"/>
    <rect x="34" y="62" width="402" height="262" rx="14" fill="url(#bezel)"/>
    <rect x="46" y="74" width="378" height="230" rx="5" fill="url(#screen)"/>
    <rect x="46" y="74" width="378" height="230" rx="5" fill="url(#screenGlow)"/>
    <!-- interface stylisée à l'écran -->
    <g opacity=".9">
      <rect x="70" y="96" width="70" height="8" rx="4" fill="#fff" opacity=".85"/>
      <rect x="70" y="110" width="44" height="5" rx="2.5" fill="#fff" opacity=".45"/>
      <rect x="132" y="150" width="62" height="96" rx="5" fill="#ffffff" opacity=".18"/>
      <rect x="204" y="138" width="78" height="120" rx="6" fill="#ffffff" opacity=".9"/>
      <rect x="208" y="142" width="70" height="10" rx="2" fill="#f43f5e"/>
      <rect x="208" y="156" width="70" height="98" rx="2" fill="#3b1a4f"/>
      <rect x="292" y="150" width="62" height="96" rx="5" fill="#ffffff" opacity=".18"/>
      <rect x="192" y="272" width="102" height="7" rx="3.5" fill="#fff" opacity=".8"/>
    </g>
    <rect x="34" y="62" width="402" height="262" rx="14" fill="none" stroke="#fff" stroke-opacity=".08"/>
    <path d="M46 74h378L46 210z" fill="#fff" opacity=".05"/>
  </g>

  <!-- Tour -->
  <g>
    <ellipse cx="520" cy="418" rx="110" ry="10" fill="#000" opacity=".5"/>
    <rect x="420" y="70" width="196" height="344" rx="10" fill="url(#caseBody)"/>
    <!-- façade -->
    <rect x="420" y="70" width="22" height="344" rx="8" fill="#0b0b10"/>
    <rect x="428" y="96" width="6" height="292" rx="3" fill="url(#rgb)" opacity=".9"/>
    <!-- vitre -->
    <rect x="450" y="82" width="154" height="320" rx="6" fill="url(#glass)"/>
    <rect x="450" y="82" width="154" height="320" rx="6" fill="url(#interior)"/>
    <!-- ventilateurs -->
    <use href="#fan" transform="translate(527 134) scale(.92)"/>
    <use href="#fan" transform="translate(527 212) scale(.92)"/>
    <!-- carte graphique -->
    <rect x="458" y="268" width="138" height="34" rx="4" fill="#15141c" stroke="#2e2b38"/>
    <rect x="462" y="296" width="130" height="3" rx="1.5" fill="url(#rgb)"/>
    <circle cx="492" cy="284" r="10" fill="#0e0d14" stroke="#3a3646"/>
    <circle cx="530" cy="284" r="10" fill="#0e0d14" stroke="#3a3646"/>
    <circle cx="568" cy="284" r="10" fill="#0e0d14" stroke="#3a3646"/>
    <!-- alimentation -->
    <rect x="458" y="330" width="138" height="62" rx="4" fill="#111017"/>
    <use href="#fan" transform="translate(527 361) scale(.5)" opacity=".75"/>
    <rect x="450" y="82" width="154" height="320" rx="6" fill="url(#glassShine)"/>
    <rect x="450" y="82" width="154" height="320" rx="6" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <!-- dessus -->
    <rect x="452" y="72" width="150" height="4" rx="2" fill="#2f2f3a"/>
    <circle cx="431" cy="82" r="3.5" fill="#f43f5e"/>
  </g>

  <!-- Clavier -->
  <g>
    <path d="M70 382h270l18 30H52z" fill="url(#kb)"/>
    <path d="M52 412h306" stroke="url(#rgb)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#33333e">
      <rect x="84" y="388" width="242" height="5" rx="1.5"/>
      <rect x="78" y="396" width="256" height="5" rx="1.5"/>
      <rect x="72" y="404" width="268" height="4" rx="1.5"/>
    </g>
  </g>
  <!-- Souris -->
  <g>
    <rect x="374" y="392" width="30" height="20" rx="10" fill="#1d1d25"/>
    <rect x="374" y="408" width="30" height="3" rx="1.5" fill="#f43f5e" opacity=".9"/>
  </g>
</svg>
