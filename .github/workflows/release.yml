# Publie une Release GitHub (installateur Windows + latest.yml) dès que la version
# de package.json change sur main. Les launchers installés se mettent à jour tout seuls.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version déjà publiée ?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La release v$V existe déjà, rien à faire."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Créer le tag de version
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          V=${{ steps.check.outputs.version }}
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            git tag "v$V"
            git push origin "v$V"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.skip == 'false'

      - name: Build & publish
        if: steps.check.outputs.skip == 'false'
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
